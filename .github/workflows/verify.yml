name: Verification gates

on:
  pull_request:
  push:
    branches: [main, agent/add-eudi-issuer-files]

permissions:
  contents: read

jobs:
  rust:
    runs-on: [self-hosted, macOS, ARM64, vcissuer]
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        working-directory: rust
        run: ~/.cargo/bin/cargo +1.97.0 fmt --all --check
      - name: Default tests
        working-directory: rust
        run: ~/.cargo/bin/cargo +1.97.0 test --workspace --locked
      - name: Shared hybrid-PQ TBS vectors
        run: |
          shasum -a 256 --check <<'SUMS'
          9470c29cb5745a726fe938b2837707f7500a2755a15c191f715460ba5cccc09f  rust/issuer-service/tests/vectors/hybrid-pq-v1-export-tbs.hex
          9522edfe321def42c355e3357a7eabf4d8205df8e75dba619d1e6a0636db972e  rust/issuer-service/tests/vectors/hybrid-pq-v1-recovery-tbs.hex
          816f9f5f3e8e62f48ce90a6a8762b0be3013c42a4b029ddaaad4a8ebef83ae03  rust/issuer-service/tests/vectors/hybrid-pq-v2-invalid-profile-tbs.hex
          a6e8ed759186eb3f2e7660e8e7681e90be4d63018d6ecf512ce85944b6582067  rust/issuer-service/tests/vectors/hybrid-pq-v1-component-mutations.json
          9ed69d0ae316c0eb221ec87f864d6bd54a7adf5edc639d716f3ac339a93a4f19  rust/issuer-service/tests/vectors/hybrid-pq-v1-component-tbs.hex
          9d47d28d9300d2b68652ec9593c31243f04d065d9b4f781f9e47b155bdeb8db5  rust/issuer-service/tests/vectors/hybrid-pq-v1-public-key-envelope.hex
          cec567a3d1cfd9152342bda49af2f9327cbfce9ba942d1901e551faf0c2bccc6  rust/issuer-service/tests/vectors/hybrid-pq-v1-signature-envelope.hex
          SUMS
      - name: Clippy
        working-directory: rust
        run: ~/.cargo/bin/cargo +1.97.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Deployed Keychain signer smoke test
        run: |
          metadata=$(curl --fail --silent --show-error https://issuer.advatar.systems/.well-known/openid-credential-issuer)
          test "$(jq -r '.signed_metadata | split(".") | length' <<<"$metadata")" = 3
          test "$(curl --fail --silent --show-error https://issuer.advatar.systems/jwks.json | jq '.keys | length')" = 5

  lean:
    runs-on: [self-hosted, macOS, ARM64, vcissuer]
    steps:
      - uses: actions/checkout@v4
      - name: Compile every Lean theorem
        working-directory: formal/lean
        run: |
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|axiom)([^[:alnum:]_]|$)' EudiIssuer; then
            echo "Lean proof placeholders are forbidden" >&2
            exit 1
          fi
          ~/actions-runner-vcissuer/.elan-local/toolchains/leanprover--lean4---v4.32.0/bin/lake build

  tamarin:
    runs-on: [self-hosted, macOS, ARM64, vcissuer]
    steps:
      - uses: actions/checkout@v4
      - name: Prove all issuance lemmas
        run: |
          ssh -i ~/actions-runner-vcissuer/tamarin-ci-key -o BatchMode=yes johansellstrom@127.0.0.1 \
            'cd ~/actions-runner-vcissuer/_work/VCIssuer/VCIssuer/formal/tamarin && MAUDE_LIB=~/actions-runner-vcissuer/tools/maude-share PATH=~/actions-runner-vcissuer/tools:/usr/bin:/bin ~/actions-runner-vcissuer/tools/tamarin-prover eudi_issuance.spthy --prove' \
            | tee tamarin-proof.txt
          ! grep -n -E '(falsified|incomplete)' tamarin-proof.txt
          for lemma in hybrid_issuance_is_atomic hybrid_components_sign_same_tbs classical_component_removal_is_rejected hybrid_generation_agreement; do
            grep -n -E "${lemma} .*verified" tamarin-proof.txt
          done

  bundle:
    runs-on: [self-hosted, macOS, ARM64, vcissuer]
    steps:
      - uses: actions/checkout@v4
      - name: Verify assurance bundle checksums
        run: shasum -a 256 --check BUNDLE_SHA256SUMS.txt
