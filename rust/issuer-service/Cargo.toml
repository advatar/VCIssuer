[package]
name = "issuer-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
axum = { version = "0.8.4", features = ["json", "query"] }
base64 = "0.22.1"
ciborium = "0.2.2"
hex = "0.4.3"
issuer-core = { path = "../issuer-core" }
libcrux-ml-dsa = { version = "0.0.10", default-features = false, features = ["mldsa65", "std"] }
rand = "0.9.2"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
# Apple App Attest: the leaf key + assertions are P-256, but the App Attest CA + Root CA are
# P-384/ES384, so the x5c chain signatures are verified with p384; x509-cert parses the certs.
p384 = { version = "0.13.1", features = ["ecdsa"] }
x509-cert = "0.2.5"
const-oid = "0.9.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
sha3 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting"] }
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
rcgen = { version = "=0.13.2", default-features = false }
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_14"] }

[dev-dependencies]
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
