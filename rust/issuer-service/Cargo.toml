[package]
name = "issuer-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.4", features = ["json", "query"] }
base64 = "0.22.1"
ciborium = "0.2.2"
issuer-core = { path = "../issuer-core" }
rand = "0.9.2"
p256 = { version = "0.13.2", features = ["ecdsa"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting"] }
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
rcgen = { version = "=0.13.2", default-features = false }
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_14"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
