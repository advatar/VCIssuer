[workspace]
resolver = "3"
members = ["issuer-core", "issuer-service"]

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
